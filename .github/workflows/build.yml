name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # "tools" (paquet par defaut de cette action) n'existe plus dans le
      # depot Android SDK - ubuntu-latest a deja un SDK preinstalle, seul
      # platform-tools sert ici (meme constat que sur seedbox-manager).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tv-screen-test-debug
          path: app/build/outputs/apk/debug/app-debug.apk
