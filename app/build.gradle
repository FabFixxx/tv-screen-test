plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fabfix.screentest'
    compileSdk 34

    defaultConfig {
        applicationId "com.fabfix.screentest"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Keystore debug FIXE committé (debug.keystore, mot de passe "android",
    // outil personnel a usage local) : sans ca, chaque run CI genere un
    // nouveau keystore debug ephemere avec une signature differente, et
    // "adb install -r" echoue (INSTALL_FAILED_UPDATE_INCOMPATIBLE) des qu'on
    // reinstalle une version plus recente sans desinstaller l'ancienne d'abord.
    signingConfigs {
        debug {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
